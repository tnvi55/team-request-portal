# Local infrastructure. Run through the root scripts (pnpm infra:up / infra:down),
# which pass the repo-root .env created by `pnpm local:setup`.
name: trp

x-postgres: &postgres
  image: postgres:18.6-alpine
  restart: unless-stopped
  environment: &postgres-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run pnpm local:setup first}
    PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?run pnpm local:setup first}
    PG_RUNTIME_PASSWORD: ${PG_RUNTIME_PASSWORD:?run pnpm local:setup first}
  healthcheck:
    test: ['CMD-SHELL', 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
    interval: 5s
    timeout: 3s
    retries: 12
  networks: [data]

services:
  # Central identities, memberships, organizations, and the tenant -> shard directory.
  postgres-control:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: trp_control
    # Loopback only: reachable from this PC (apps in dev, inspection tools), not the network.
    ports: ['127.0.0.1:5433:5432']
    volumes:
      - pg-control:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Tenant shard A: Atlas and Cedar business records.
  postgres-shard-a:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: trp_shard_a
    ports: ['127.0.0.1:5434:5432']
    volumes:
      - pg-shard-a:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Tenant shard B: Birch business records.
  postgres-shard-b:
    <<: *postgres
    environment:
      <<: *postgres-env
      POSTGRES_DB: trp_shard_b
    ports: ['127.0.0.1:5435:5432']
    volumes:
      - pg-shard-b:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  # Shared sessions, rate-limit counters, and short-lived dashboard cache.
  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # noeviction: under memory pressure Redis rejects writes instead of silently
    # deleting session/limiter keys. appendonly keeps sessions across a Redis restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run pnpm local:setup first}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    ports: ['127.0.0.1:6380:6379']
    volumes:
      - redis-data:/data
    networks: [data]

  # Same-origin entry point: http://localhost:8080 -> /api/* to NestJS, everything else to Next.js.
  proxy:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:8080:8080']
    extra_hosts: ['host.docker.internal:host-gateway']
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8080/nginx-health']
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [edge]

networks:
  edge: {}
  data: {}

# Named volumes survive `infra:down`. Nothing in this repo deletes them by default.
volumes:
  pg-control: {}
  pg-shard-a: {}
  pg-shard-b: {}
  redis-data: {}
