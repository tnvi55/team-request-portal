# Development: Next.js (3000) and NestJS (3001) run on the Windows host via `pnpm dev`.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream web { server host.docker.internal:3000; }
upstream api { server host.docker.internal:3001; }

server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  client_max_body_size 64k;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # No URI after the upstream name: the path is forwarded unchanged (/api/v1/...).
  location /api/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_pass http://api;
  }

  location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    # WebSocket upgrade for Next.js hot reload.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://web;
  }
}
