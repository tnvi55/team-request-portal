# Development: Next.js (3000) and NestJS (3001) run on the Windows host via `pnpm dev`.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Docker 29 maps host.docker.internal to an IPv4 and an IPv6 address, and the IPv6 one is
# unreachable from this IPv4-only network. A failed connect moves on to the other address at
# once, but with the default max_fails=1 one refused connect (e.g. the dev API restarting) also
# took the IPv4 address out for 10 s -> "no live upstreams" -> 502. There is only one real host
# here, so never mark it down.
upstream web { server host.docker.internal:3000 max_fails=0; }
upstream api { server host.docker.internal:3001 max_fails=0; }

server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  client_max_body_size 64k;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # No URI after the upstream name: the path is forwarded unchanged (/api/v1/...).
  location /api/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_pass http://api;
  }

  location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    # WebSocket upgrade for Next.js hot reload.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://web;
  }
}
