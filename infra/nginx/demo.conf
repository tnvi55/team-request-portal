# Production-build replica demo: two identical web and two identical API containers.
# Round-robin, no sticky sessions: any instance can serve any request because state is in Redis/Postgres.
upstream web {
  # Shared memory: all nginx workers use one round-robin counter and one failure state.
  zone web_upstream 64k;
  server web-1:3000 max_fails=1 fail_timeout=5s;
  server web-2:3000 max_fails=1 fail_timeout=5s;
}
upstream api {
  zone api_upstream 64k;
  server api-1:3001 max_fails=1 fail_timeout=5s;
  server api-2:3001 max_fails=1 fail_timeout=5s;
}

server {
  listen 8080;
  server_name localhost;
  server_tokens off;
  client_max_body_size 64k;

  # Safe reads may move to the other instance on connection failure. Nginx never retries
  # non-idempotent requests (POST/PATCH) here, so an ambiguous write is not repeated.
  proxy_next_upstream error timeout http_502 http_503;

  # Local demo evidence only: which container answered.
  add_header X-Upstream $upstream_addr always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_pass http://api;
  }

  location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Connection "";
    proxy_pass http://web;
  }
}
